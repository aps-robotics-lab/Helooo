{% extends "base.html" %}{% block title %}Help Center | RoboKriti 2026{% endblock %}
{% block content %}<main class="form-page"><div class="form-hero"><span>PARTICIPANT SUPPORT</span><h1>How can we <em>help?</em></h1><p>Submit a support request and receive a ticket ID for follow-up.</p></div>
<form id="helpForm" class="form-card"><section><div class="grid"><input name="name" placeholder="Your Name *" required><input name="email" type="email" placeholder="Email Address *" required><input name="registration_id" placeholder="Registration ID (optional)"><select name="category" required><option value="">Select Category *</option><option>Registration</option><option>Event Rules</option><option>Technical</option><option>General</option></select></div><textarea name="message" placeholder="Describe your question *" required></textarea><div id="helpMsg"></div><button class="btn primary" type="submit">SEND REQUEST ↗</button></section></form></main>{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/help.js') }}"></script>{% endblock %}
